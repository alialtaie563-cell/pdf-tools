<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أدوات PDF والصور | PDF Toolkit</title>
<meta name="description" content="أدوات PDF والصور مجانية تعمل بالكامل داخل متصفحك: دمج، تقسيم، تحويل الصور، حماية بكلمة مرور، وعلامة مائية. Free client-side PDF & image tools.">

<!-- Apply saved theme before first paint (prevents flash) -->
<script>
  (function () {
    try {
      var th = localStorage.getItem('theme') || 'dark';
      if (th === 'light') document.documentElement.classList.remove('dark');
    } catch (e) {}
  })();
</script>

<!-- Fonts: Cairo (Arabic + Latin) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Tailwind CSS (CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  if (window.tailwind) {
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Cairo', 'system-ui', 'sans-serif'] } } }
    };
  }
</script>

<!-- Libraries (pdf-lib, jsPDF, pdf-lib-plus-encrypt) are loaded by the app script below,
     each from several CDNs in turn (cdnjs -> jsDelivr -> unpkg), so one blocked CDN can't break the site. -->

<style type="text/tailwindcss">
  @layer components {
    .card { @apply rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900; }
    .btn-primary { @apply inline-flex items-center justify-center gap-2 rounded-xl bg-blue-500 px-6 py-3 font-bold text-white shadow-lg shadow-blue-500/25 transition hover:bg-blue-600 active:scale-[.98] focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-900; }
    .btn-soft { @apply inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700; }
    .field { @apply w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100 dark:placeholder-slate-500; }
    .lbl { @apply mb-1.5 block text-sm font-semibold text-slate-600 dark:text-slate-300; }
    .icon-btn { @apply inline-flex h-9 w-9 items-center justify-center rounded-lg text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white; }
  }
</style>

<style>
  body { font-family: 'Cairo', system-ui, sans-serif; }
  /* Drop zone */
  .dz {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5rem;
    padding: 2.25rem 1rem; text-align: center; cursor: pointer;
    border: 2px dashed rgb(148 163 184 / .6); border-radius: 1rem;
    background: rgb(59 130 246 / .04); transition: all .2s ease;
  }
  .dz:hover, .dz:focus-visible, .dz.dz-over {
    border-color: #3b82f6; background: rgb(59 130 246 / .1); transform: translateY(-1px); outline: none;
  }
  .dz.dz-over { box-shadow: 0 0 0 4px rgb(59 130 246 / .18); }
  /* Spinner */
  .spinner {
    width: 64px; height: 64px; border-radius: 9999px;
    border: 5px solid rgb(59 130 246 / .2); border-top-color: #3b82f6;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .pop { animation: pop .25s ease both; }
  input[type=range] { accent-color: #3b82f6; }
  .tab-active { border-color: #3b82f6 !important; background: rgb(59 130 246 / .1) !important; box-shadow: 0 0 0 3px rgb(59 130 246 / .18); }
  .scroll-soft::-webkit-scrollbar { width: 8px; }
  .scroll-soft::-webkit-scrollbar-thumb { background: rgb(148 163 184 / .4); border-radius: 8px; }
</style>
</head>

<body class="min-h-screen bg-slate-50 text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-100">

<!-- ============================ HEADER ============================ -->
<header class="sticky top-0 z-30 border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-950/80">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3">
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-500 text-white shadow-lg shadow-blue-500/30">
        <i data-lucide="file-text" class="h-5 w-5"></i>
      </div>
      <div class="leading-tight">
        <p class="text-lg font-extrabold" data-i18n="appName"></p>
        <p class="hidden text-xs text-slate-500 dark:text-slate-400 sm:block" data-i18n="appTag"></p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <a data-wa target="_blank" rel="noopener noreferrer"
         class="inline-flex items-center gap-2 rounded-xl bg-emerald-500 px-4 py-2 text-sm font-bold text-white shadow-lg shadow-emerald-500/25 transition hover:bg-emerald-600">
        <i data-lucide="message-circle" class="h-4 w-4"></i>
        <span class="hidden md:inline" data-i18n="waCta"></span>
        <span class="md:hidden" data-i18n="waShort"></span>
      </a>
      <button id="langBtn" class="btn-soft" aria-label="Language">
        <i data-lucide="languages" class="h-4 w-4"></i><span id="langLabel">English</span>
      </button>
      <button id="themeBtn" class="icon-btn border border-slate-200 dark:border-slate-700" aria-label="Theme">
        <i data-lucide="sun" class="hidden h-5 w-5 dark:block"></i>
        <i data-lucide="moon" class="h-5 w-5 dark:hidden"></i>
      </button>
    </div>
  </div>
</header>

<!-- ============================ MAIN ============================ -->
<main class="mx-auto max-w-6xl px-4 py-8 sm:py-12">

  <!-- Hero -->
  <section class="mb-8 text-center">
    <h1 class="text-3xl font-extrabold leading-tight sm:text-4xl" data-i18n="heroTitle"></h1>
    <p class="mx-auto mt-3 max-w-2xl text-slate-500 dark:text-slate-400" data-i18n="heroSub"></p>
  </section>

  <!-- Tool tabs -->
  <nav id="tabs" class="mb-8 grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-5" aria-label="Tools">
    <button data-tab="merge" class="card flex flex-col items-center gap-2 p-4 text-center transition hover:-translate-y-0.5 hover:border-blue-400">
      <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-500/10 text-blue-500"><i data-lucide="merge" class="h-6 w-6"></i></span>
      <span class="text-sm font-bold" data-i18n="merge"></span>
    </button>
    <button data-tab="split" class="card flex flex-col items-center gap-2 p-4 text-center transition hover:-translate-y-0.5 hover:border-blue-400">
      <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-500/10 text-blue-500"><i data-lucide="scissors" class="h-6 w-6"></i></span>
      <span class="text-sm font-bold" data-i18n="split"></span>
    </button>
    <button data-tab="img" class="card flex flex-col items-center gap-2 p-4 text-center transition hover:-translate-y-0.5 hover:border-blue-400">
      <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-500/10 text-blue-500"><i data-lucide="images" class="h-6 w-6"></i></span>
      <span class="text-sm font-bold" data-i18n="img"></span>
    </button>
    <button data-tab="protect" class="card flex flex-col items-center gap-2 p-4 text-center transition hover:-translate-y-0.5 hover:border-blue-400">
      <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-500/10 text-blue-500"><i data-lucide="lock" class="h-6 w-6"></i></span>
      <span class="text-sm font-bold" data-i18n="protect"></span>
    </button>
    <button data-tab="wm" class="card col-span-2 flex flex-col items-center gap-2 p-4 text-center transition hover:-translate-y-0.5 hover:border-blue-400 sm:col-span-1">
      <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-500/10 text-blue-500"><i data-lucide="stamp" class="h-6 w-6"></i></span>
      <span class="text-sm font-bold" data-i18n="wm"></span>
    </button>
  </nav>

  <!-- ===================== 1. MERGE ===================== -->
  <section id="tool-merge" data-tool="merge" class="tool card hidden p-5 sm:p-8">
    <div class="mb-6">
      <h2 class="text-2xl font-extrabold" data-i18n="merge"></h2>
      <p class="mt-1 text-slate-500 dark:text-slate-400" data-i18n="mergeDesc"></p>
    </div>
    <div data-dz data-tool="merge" data-accept=".pdf,application/pdf" data-multiple="true" data-key="dropPdfMulti" data-icon="upload"></div>

    <div id="mergeWrap" class="mt-6 hidden">
      <div class="mb-3 flex items-center justify-between">
        <h3 class="font-bold"><span data-i18n="files"></span> (<span id="mergeCount">0</span>)</h3>
        <button data-clear="merge" class="text-sm font-semibold text-red-500 hover:underline" data-i18n="clearAll"></button>
      </div>
      <ul id="mergeList" class="scroll-soft max-h-96 space-y-2 overflow-y-auto"></ul>
      <p class="mt-3 text-xs text-slate-500 dark:text-slate-400" data-i18n="mergeHint"></p>
    </div>

    <button id="btnMerge" class="btn-primary mt-6 w-full sm:w-auto"><i data-lucide="merge" class="h-5 w-5"></i><span data-i18n="btnMerge"></span></button>
    <div data-result="merge"></div>
  </section>

  <!-- ===================== 2. SPLIT ===================== -->
  <section id="tool-split" data-tool="split" class="tool card hidden p-5 sm:p-8">
    <div class="mb-6">
      <h2 class="text-2xl font-extrabold" data-i18n="split"></h2>
      <p class="mt-1 text-slate-500 dark:text-slate-400" data-i18n="splitDesc"></p>
    </div>
    <div data-dz data-tool="split" data-accept=".pdf,application/pdf" data-multiple="false" data-key="dropPdfOne" data-icon="upload"></div>
    <div data-single="split" class="mt-4"></div>

    <div id="splitOpts" class="mt-6 hidden">
      <label class="lbl" for="splitRange" data-i18n="rangeLabel"></label>
      <input id="splitRange" type="text" dir="ltr" class="field" data-i18n-ph="rangePh" autocomplete="off" inputmode="text">
      <p class="mt-2 text-xs text-slate-500 dark:text-slate-400" data-i18n="rangeHint"></p>
    </div>

    <button id="btnSplit" class="btn-primary mt-6 w-full sm:w-auto"><i data-lucide="scissors" class="h-5 w-5"></i><span data-i18n="btnSplit"></span></button>
    <div data-result="split"></div>
  </section>

  <!-- ===================== 3. IMAGES -> PDF ===================== -->
  <section id="tool-img" data-tool="img" class="tool card hidden p-5 sm:p-8">
    <div class="mb-6">
      <h2 class="text-2xl font-extrabold" data-i18n="img"></h2>
      <p class="mt-1 text-slate-500 dark:text-slate-400" data-i18n="imgDesc"></p>
    </div>
    <div data-dz data-tool="img" data-accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" data-multiple="true" data-key="dropImg" data-icon="image-plus"></div>

    <div id="imgWrap" class="mt-6 hidden">
      <div class="mb-3 flex items-center justify-between">
        <h3 class="font-bold"><span data-i18n="images"></span> (<span id="imgCount">0</span>)</h3>
        <button data-clear="img" class="text-sm font-semibold text-red-500 hover:underline" data-i18n="clearAll"></button>
      </div>
      <ul id="imgList" class="scroll-soft max-h-[28rem] space-y-2 overflow-y-auto"></ul>
      <p class="mt-3 text-xs text-slate-500 dark:text-slate-400" data-i18n="mergeHint"></p>

      <div class="mt-5 grid gap-4 sm:grid-cols-2">
        <div>
          <label class="lbl" for="imgPage" data-i18n="pageSize"></label>
          <select id="imgPage" class="field">
            <option value="fit" data-i18n="pageFit"></option>
            <option value="a4" data-i18n="pageA4"></option>
          </select>
        </div>
        <div>
          <label class="lbl" for="imgQuality" data-i18n="quality"></label>
          <select id="imgQuality" class="field">
            <option value="0.95" data-i18n="qHigh"></option>
            <option value="0.8" data-i18n="qMed"></option>
            <option value="0.55" data-i18n="qLow"></option>
          </select>
        </div>
      </div>
    </div>

    <button id="btnImg" class="btn-primary mt-6 w-full sm:w-auto"><i data-lucide="file-plus" class="h-5 w-5"></i><span data-i18n="btnImg"></span></button>
    <div data-result="img"></div>
  </section>

  <!-- ===================== 4. PROTECT ===================== -->
  <section id="tool-protect" data-tool="protect" class="tool card hidden p-5 sm:p-8">
    <div class="mb-6">
      <h2 class="text-2xl font-extrabold" data-i18n="protect"></h2>
      <p class="mt-1 text-slate-500 dark:text-slate-400" data-i18n="protectDesc"></p>
    </div>
    <div data-dz data-tool="protect" data-accept=".pdf,application/pdf" data-multiple="false" data-key="dropPdfOne" data-icon="upload"></div>
    <div data-single="protect" class="mt-4"></div>

    <div class="mt-6 grid gap-4 sm:grid-cols-2">
      <div>
        <label class="lbl" for="pw1" data-i18n="password"></label>
        <div class="relative">
          <input id="pw1" type="password" dir="ltr" class="field pe-11" autocomplete="new-password" maxlength="64">
          <button type="button" id="pwToggle" class="icon-btn absolute end-1 top-1/2 -translate-y-1/2" aria-label="Show / hide">
            <i data-lucide="eye" class="h-5 w-5"></i>
          </button>
        </div>
      </div>
      <div>
        <label class="lbl" for="pw2" data-i18n="passwordConfirm"></label>
        <input id="pw2" type="password" dir="ltr" class="field" autocomplete="new-password" maxlength="64">
      </div>
    </div>
    <p class="mt-3 flex items-start gap-2 rounded-xl bg-amber-500/10 p-3 text-sm text-amber-700 dark:text-amber-300">
      <i data-lucide="shield-check" class="mt-0.5 h-4 w-4 shrink-0"></i><span data-i18n="protectNote"></span>
    </p>

    <button id="btnProtect" class="btn-primary mt-6 w-full sm:w-auto"><i data-lucide="lock" class="h-5 w-5"></i><span data-i18n="btnProtect"></span></button>
    <div data-result="protect"></div>
  </section>

  <!-- ===================== 5. WATERMARK ===================== -->
  <section id="tool-wm" data-tool="wm" class="tool card hidden p-5 sm:p-8">
    <div class="mb-6">
      <h2 class="text-2xl font-extrabold" data-i18n="wm"></h2>
      <p class="mt-1 text-slate-500 dark:text-slate-400" data-i18n="wmDesc"></p>
    </div>
    <div data-dz data-tool="wm" data-accept=".pdf,application/pdf" data-multiple="false" data-key="dropPdfOne" data-icon="upload"></div>
    <div data-single="wm" class="mt-4"></div>

    <div class="mt-6 grid gap-6 lg:grid-cols-2">
      <div class="space-y-4">
        <div>
          <label class="lbl" for="wmText" data-i18n="wmText"></label>
          <input id="wmText" type="text" dir="auto" maxlength="60" class="field" data-i18n-ph="wmTextPh">
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label class="lbl" for="wmLayout" data-i18n="wmLayout"></label>
            <select id="wmLayout" class="field">
              <option value="center" data-i18n="wmCenter"></option>
              <option value="tile" data-i18n="wmTile"></option>
            </select>
          </div>
          <div>
            <label class="lbl" for="wmColor" data-i18n="wmColor"></label>
            <input id="wmColor" type="color" value="#3b82f6" class="h-[2.7rem] w-full cursor-pointer rounded-xl border border-slate-300 bg-white p-1 dark:border-slate-700 dark:bg-slate-950">
          </div>
        </div>
        <div>
          <label class="lbl" for="wmSize"><span data-i18n="wmSize"></span>: <span id="wmSizeVal" dir="ltr">48</span></label>
          <input id="wmSize" type="range" min="16" max="120" value="48" class="w-full">
        </div>
        <div>
          <label class="lbl" for="wmOpacity"><span data-i18n="wmOpacity"></span>: <span id="wmOpacityVal" dir="ltr">25%</span></label>
          <input id="wmOpacity" type="range" min="5" max="100" value="25" class="w-full">
        </div>
      </div>

      <div>
        <p class="lbl" data-i18n="wmPreview"></p>
        <div class="relative mx-auto flex h-56 w-full max-w-sm items-center justify-center overflow-hidden rounded-xl border border-slate-300 bg-white shadow-inner dark:border-slate-700">
          <div class="absolute inset-x-6 top-6 space-y-2 opacity-60">
            <div class="h-2 rounded bg-slate-200"></div><div class="h-2 w-5/6 rounded bg-slate-200"></div>
            <div class="h-2 w-4/6 rounded bg-slate-200"></div><div class="h-2 rounded bg-slate-200"></div>
            <div class="h-2 w-3/6 rounded bg-slate-200"></div>
          </div>
          <img id="wmPreviewImg" alt="" class="absolute left-1/2 top-1/2 hidden max-w-[85%]" style="transform: translate(-50%,-50%) rotate(-45deg);">
        </div>
      </div>
    </div>

    <button id="btnWm" class="btn-primary mt-6 w-full sm:w-auto"><i data-lucide="stamp" class="h-5 w-5"></i><span data-i18n="btnWm"></span></button>
    <div data-result="wm"></div>
  </section>
</main>

<!-- ============================ FOOTER ============================ -->
<footer class="border-t border-slate-200 bg-white py-8 dark:border-slate-800 dark:bg-slate-900">
  <div class="mx-auto flex max-w-6xl flex-col items-center gap-5 px-4 text-center">
    <div class="rounded-2xl border border-emerald-500/30 bg-emerald-500/10 px-5 py-3 text-sm font-semibold text-emerald-700 dark:text-emerald-300" dir="auto">
      🔒 100% Safe &amp; Private - Files never leave your device / معالجة آمنة ومحلية 100% - ملفاتك لا تغادر جهازك
    </div>
    <a data-wa target="_blank" rel="noopener noreferrer"
       class="inline-flex items-center gap-2 rounded-xl bg-emerald-500 px-6 py-3 font-bold text-white shadow-lg shadow-emerald-500/25 transition hover:bg-emerald-600">
      <i data-lucide="message-circle" class="h-5 w-5"></i><span data-i18n="waCta"></span>
    </a>
    <p class="text-xs text-slate-400">© <span id="year"></span> <span data-i18n="appName"></span></p>
  </div>
</footer>

<!-- ============================ LOADING OVERLAY ============================ -->
<div id="loading" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/70 p-4 backdrop-blur-sm" role="alert" aria-live="assertive">
  <div class="card pop w-full max-w-sm p-8 text-center">
    <div class="spinner mx-auto"></div>
    <p class="mt-5 text-lg font-bold" data-i18n="processing"></p>
    <p id="loadingLabel" class="mt-1 min-h-[1.25rem] text-sm text-slate-500 dark:text-slate-400" dir="auto"></p>
    <div class="mt-4 h-2.5 w-full overflow-hidden rounded-full bg-slate-200 dark:bg-slate-800">
      <div id="loadingBar" class="h-full w-0 rounded-full bg-blue-500 transition-all duration-300"></div>
    </div>
    <p class="mt-3 text-xs text-slate-400" data-i18n="keepOpen"></p>
  </div>
</div>

<!-- Toasts -->
<div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-4 z-[60] flex flex-col items-center gap-2 px-4"></div>

<!-- ============================ APP LOGIC ============================ -->

    for (const f of files) {
      if (!test(f)) { rejected++; continue; }
      if (f.size > MAX_FILE_MB * 1024 * 1024) { toast(`${t('errTooBig').replace('%MB%', MAX_FILE_MB)}: ${f.name}`, 'error'); continue; }
      ok.push(f);
    }
    if (rejected) toast(t(errKey), 'error');
    return ok;
  }

  /** Reads a PDF just to learn its page count (and validate it). */
  async function inspectPdf(file) {
    await ensurePdfLib();
    try {
      const doc = await PDFLib.PDFDocument.load(await file.arrayBuffer());
      return doc.getPageCount();
    } catch (e) { throw fileError(e, file.name); }
  }

  async function handleFiles(tool, files) {
    if (!files.length) return;
    try {
      if (tool === 'merge') {
        const ok = filterFiles(files, isPdf, 'errNotPdf');
        ok.forEach(file => state.merge.push({ id: ++uid, file }));
        setResult('merge', null); renderList('merge');
      } else if (tool === 'img') {
        const ok = filterFiles(files, isImg, 'errNotImage');
        ok.forEach(file => state.img.push({ id: ++uid, file, url: URL.createObjectURL(file) }));
        setResult('img', null); renderList('img');
      } else {
        // single-PDF tools: split, protect, wm
        const ok = filterFiles(files.slice(0, 1), isPdf, 'errNotPdf');
        if (!ok.length) return;
        const file = ok[0];
        showLoading(); setProgress(.4, file.name);
        try {
          const pages = await inspectPdf(file);
          state[tool] = { file, pages };
        } finally { hideLoading(); }
        setResult(tool, null);
        if (tool === 'split') $('#splitRange').value = `1-${state.split.pages}`;
        renderSingle(tool);
      }
    } catch (e) {
      console.error(e);
      toast(e instanceof UserError ? e.message : t('errGeneric'), 'error');
    }
  }

  /* ------------------------------------------------------------------
   * Rendering lists / single-file cards
   * ------------------------------------------------------------------ */
  function renderList(tool) {
    const arr = state[tool];
    const wrap = $(`#${tool}Wrap`);
    wrap.classList.toggle('hidden', arr.length === 0);
    $(`#${tool}Count`).textContent = arr.length;
    $(`#${tool}List`).innerHTML = arr.map((it, i) => `
      <li data-i="${i}" class="flex items-center gap-3 rounded-xl border border-slate-200 bg-slate-50 p-2.5 dark:border-slate-800 dark:bg-slate-950">
        <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-blue-500/10 text-xs font-bold text-blue-500">${i + 1}</span>
        ${tool === 'img'
          ? `<img src="${it.url}" alt="" class="h-14 w-14 shrink-0 rounded-lg border border-slate-200 object-cover dark:border-slate-700">`
          : `<span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-red-500/10 text-red-500"><i data-lucide="file-text" class="h-5 w-5"></i></span>`}
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-semibold" dir="auto">${esc(it.file.name)}</p>
          <p class="text-xs text-slate-500 dark:text-slate-400" dir="ltr" style="text-align:start">${fmtSize(it.file.size)}</p>
        </div>
        <div class="flex shrink-0 items-center">
          <button data-act="up" class="icon-btn" title="${esc(t('moveUp'))}" ${i === 0 ? 'disabled style="opacity:.3"' : ''}><i data-lucide="chevron-up" class="h-5 w-5"></i></button>
          <button data-act="down" class="icon-btn" title="${esc(t('moveDown'))}" ${i === arr.length - 1 ? 'disabled style="opacity:.3"' : ''}><i data-lucide="chevron-down" class="h-5 w-5"></i></button>
          <button data-act="rm" class="icon-btn hover:!text-red-500" title="${esc(t('remove'))}"><i data-lucide="trash-2" class="h-5 w-5"></i></button>
        </div>
      </li>`).join('');
    lucide.createIcons();
  }

  function renderSingle(tool) {
    const slot = $(`[data-single="${tool}"]`);
    const it = state[tool];
    if (tool === 'split') $('#splitOpts').classList.toggle('hidden', !it);
    if (!it) { slot.innerHTML = ''; return; }
    slot.innerHTML = `
      <div class="pop flex items-center gap-3 rounded-xl border border-slate-200 bg-slate-50 p-3 dark:border-slate-800 dark:bg-slate-950">
        <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-red-500/10 text-red-500"><i data-lucide="file-text" class="h-5 w-5"></i></span>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-semibold" dir="auto">${esc(it.file.name)}</p>
          <p class="text-xs text-slate-500 dark:text-slate-400">${fmtSize(it.file.size)}${it.pages ? ` · ${esc(t('totalPages'))}: ${it.pages}` : ''}</p>
        </div>
        <button data-clear="${tool}" class="icon-btn hover:!text-red-500" title="${esc(t('remove'))}"><i data-lucide="trash-2" class="h-5 w-5"></i></button>
      </div>`;
    lucide.createIcons();
  }

  function clearTool(tool) {
    if (tool === 'img') state.img.forEach(i => URL.revokeObjectURL(i.url));
    if (tool === 'merge' || tool === 'img') { state[tool] = []; renderList(tool); }
    else {
      state[tool] = null;
      if (tool === 'split') $('#splitRange').value = '';
      renderSingle(tool);
    }
    setResult(tool, null);
  }

  function bindListActions() {
    ['merge', 'img'].forEach(tool => {
      $(`#${tool}List`).addEventListener('click', e => {
        const b = e.target.closest('button[data-act]');
        if (!b || b.disabled) return;
        const i = +b.closest('li').dataset.i;
        const arr = state[tool];
        const act = b.dataset.act;
        if (act === 'up' && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
        else if (act === 'down' && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
        else if (act === 'rm') { if (tool === 'img') URL.revokeObjectURL(arr[i].url); arr.splice(i, 1); }
        setResult(tool, null);
        renderList(tool);
      });
    });
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-clear]');
      if (b) clearTool(b.dataset.clear);
    });
  }

  /* ------------------------------------------------------------------
   * TOOL 1: Merge
   * ------------------------------------------------------------------ */
  async function doMerge() {
    if (state.merge.length < 2) return toast(t('errNeedTwo'), 'error');
    await runTask('merge', async progress => {
      await ensurePdfLib();
      const out = await PDFLib.PDFDocument.create();
      const n = state.merge.length;
      for (let i = 0; i < n; i++) {
        const f = state.merge[i].file;
        progress(i / n * 0.9, `${t('adding')} ${i + 1}/${n} — ${f.name}`);
        await tick();
        let src;
        try { src = await PDFLib.PDFDocument.load(await f.arrayBuffer()); }
        catch (e) { throw fileError(e, f.name); }
        const pages = await out.copyPages(src, src.getPageIndices());
        pages.forEach(p => out.addPage(p));
      }
      progress(.95, t('saving'));
      return { bytes: await out.save(), name: 'merged.pdf' };
    });
  }

  /* ------------------------------------------------------------------
   * TOOL 2: Split / extract pages
   * ------------------------------------------------------------------ */
  /** Parses "1-3, 7, 9-12" (also Arabic-Indic digits) into sorted-by-input 0-based indices. */
  function parseRanges(str, max) {
    const normalized = str
      .replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x660)
      .replace(/[\u06F0-\u06F9]/g, d => d.charCodeAt(0) - 0x6F0)
      .replace(/[،;؛\s]+/g, ',');
    const parts = normalized.split(',').map(s => s.trim()).filter(Boolean);
    if (!parts.length) throw new UserError(t('errRange').replace('%N%', max));
    const seen = new Set(); const out = [];
    for (const p of parts) {
      const m = p.match(/^(\d+)(?:[-–—](\d+))?$/);
      if (!m) throw new UserError(t('errRange').replace('%N%', max));
      const a = +m[1], b = m[2] ? +m[2] : a;
      if (a < 1 || b > max || a > b) throw new UserError(t('errRange').replace('%N%', max));
      for (let i = a; i <= b; i++) if (!seen.has(i)) { seen.add(i); out.push(i - 1); }
    }
    return out;
  }

  async function doSplit() {
    const s = state.split;
    if (!s) return toast(t('errNeedFile'), 'error');
    let indices;
    try { indices = parseRanges($('#splitRange').value, s.pages); }
    catch (e) { return toast(e instanceof UserError ? e.message : t('errGeneric'), 'error'); }
    await runTask('split', async progress => {
      await ensurePdfLib();
      progress(.2, `${t('reading')} — ${s.file.name}`); await tick();
      let src;
      try { src = await PDFLib.PDFDocument.load(await s.file.arrayBuffer()); }
      catch (e) { throw fileError(e, s.file.name); }
      const out = await PDFLib.PDFDocument.create();
      progress(.5, `${indices.length} ${t('pagesUnit')}`); await tick();
      const pages = await out.copyPages(src, indices);
      pages.forEach(p => out.addPage(p));
      progress(.9, t('saving'));
      return { bytes: await out.save(), name: `${baseName(s.file.name)}_pages.pdf` };
    });
  }

  /* ------------------------------------------------------------------
   * TOOL 3: Images -> PDF (jsPDF)
   * ------------------------------------------------------------------ */
  function loadImage(url, name) {
    return new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = () => reject(new UserError(`${t('errImage')}: ${name}`));
      im.src = url;
    });
  }

  async function doImages() {
    if (!state.img.length) return toast(t('errNeedImg'), 'error');
    const mode = $('#imgPage').value;
    const quality = parseFloat($('#imgQuality').value);
    await runTask('img', async progress => {
      progress(.02, t('preparing'));
      const jsPDF = await ensureJsPdf();
      let doc = null;
      const n = state.img.length;
      for (let i = 0; i < n; i++) {
        const it = state.img[i];
        progress(i / n * 0.92, `${t('adding')} ${i + 1}/${n} — ${it.file.name}`);
        await tick();
        const im = await loadImage(it.url, it.file.name);
        // Re-draw on a white canvas: flattens PNG transparency and normalises PNG/JPG/WebP to JPEG.
        const k = Math.min(1, MAX_IMAGE_DIM / Math.max(im.naturalWidth, im.naturalHeight));
        const cw = Math.max(1, Math.round(im.naturalWidth * k)), ch = Math.max(1, Math.round(im.naturalHeight * k));
        const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(im, 0, 0, cw, ch);
        const data = cv.toDataURL('image/jpeg', quality);
        cv.width = cv.height = 0;

        if (mode === 'fit') {
          const pw = cw * 0.75, ph = ch * 0.75;      // px -> pt
          const orient = pw > ph ? 'l' : 'p';
          if (!doc) doc = new jsPDF({ orientation: orient, unit: 'pt', format: [pw, ph], compress: true });
          else doc.addPage([pw, ph], orient);
          doc.addImage(data, 'JPEG', 0, 0, pw, ph, undefined, 'FAST');
        } else {
          const orient = cw > ch ? 'l' : 'p';
          if (!doc) doc = new jsPDF({ orientation: orient, unit: 'mm', format: 'a4', compress: true });
          else doc.addPage('a4', orient);
          const PW = orient === 'l' ? 297 : 210, PH = orient === 'l' ? 210 : 297, M = 10;
          const r = Math.min((PW - 2 * M) / cw, (PH - 2 * M) / ch);
          const iw = cw * r, ih = ch * r;
          doc.addImage(data, 'JPEG', (PW - iw) / 2, (PH - ih) / 2, iw, ih, undefined, 'FAST');
        }
      }
      progress(.96, t('saving'));
      return { bytes: new Uint8Array(doc.output('arraybuffer')), name: 'images.pdf' };
    });
  }

  /* ------------------------------------------------------------------
   * TOOL 4: Protect PDF (password encryption)
   * ------------------------------------------------------------------ */
  function randomHex(len = 16) {
    const a = new Uint8Array(len); crypto.getRandomValues(a);
    return [...a].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function doProtect() {
    const s = state.protect;
    if (!s) return toast(t('errNeedFile'), 'error');
    const pw = $('#pw1').value, pw2 = $('#pw2').value;
    if (!pw) return toast(t('errPwEmpty'), 'error');
    if (pw !== pw2) return toast(t('errPwMismatch'), 'error');
    await runTask('protect', async progress => {
      progress(.1, t('preparing'));
      await ensureEncLib();
      progress(.25, `${t('reading')} — ${s.file.name}`); await tick();
      let pdf;
      try { pdf = await PDFLibEnc.PDFDocument.load(await s.file.arrayBuffer()); }
      catch (e) { throw fileError(e, s.file.name); }
      if (typeof pdf.encrypt !== 'function') throw new UserError(t('errEncLib'));
      progress(.6, t('preparing')); await tick();
      pdf.encrypt({
        userPassword: pw,                         // password required to open the file
        ownerPassword: pw + '#' + randomHex(),    // separate random owner password
        permissions: {
          printing: 'highResolution', copying: true, contentAccessibility: true,
          modifying: false, annotating: false, fillingForms: false, documentAssembly: false
        }
      });
      progress(.85, t('saving'));
      return { bytes: await pdf.save(), name: `${baseName(s.file.name)}_protected.pdf` };
    });
  }

  /* ------------------------------------------------------------------
   * TOOL 5: Watermark
   * Text is drawn on a canvas by the browser (so Arabic shaping / RTL works
   * perfectly) and embedded as a transparent PNG on each page.
   * ------------------------------------------------------------------ */
  async function renderWmCanvas(text, size, color) {
    try { await document.fonts.load(`700 ${size}px Cairo`, text); } catch (e) {}
    const S = 3;                                   // supersampling for crisp output
    const font = `700 ${size * S}px Cairo, sans-serif`;
    const m = document.createElement('canvas').getContext('2d');
    m.font = font;
    const w = Math.ceil(m.measureText(text).width + size * S * 0.8);
    const h = Math.ceil(size * S * 1.8);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.font = font; ctx.fillStyle = color;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.direction = /[\u0590-\u08FF]/.test(text) ? 'rtl' : 'ltr';
    ctx.fillText(text, w / 2, h / 2);
    return { canvas: c, w: w / S, h: h / S };
  }

  let previewSeq = 0;
  async function updateWmPreview() {
    const seq = ++previewSeq;
    const img = $('#wmPreviewImg');
    const text = $('#wmText').value.trim();
    $('#wmSizeVal').textContent = $('#wmSize').value;
    $('#wmOpacityVal').textContent = $('#wmOpacity').value + '%';
    if (!text) { img.classList.add('hidden'); return; }
    // The preview card is ~384px wide; scale the font so the preview roughly matches an A4 page.
    const size = Math.max(8, +$('#wmSize').value * 0.5);
    const { canvas, w } = await renderWmCanvas(text, size, $('#wmColor').value);
    if (seq !== previewSeq) return;
    img.src = canvas.toDataURL('image/png');
    img.style.width = Math.min(w, 330) + 'px';
    img.style.opacity = (+$('#wmOpacity').value) / 100;
    img.classList.remove('hidden');
  }

  /** Draws `png` so that its CENTER lands on (cx, cy), rotated CCW by `deg` degrees. */
  function drawRotated(page, png, cx, cy, w, h, deg, opacity) {
    const th = deg * Math.PI / 180;
    const x = cx - (w / 2 * Math.cos(th) - h / 2 * Math.sin(th));
    const y = cy - (w / 2 * Math.sin(th) + h / 2 * Math.cos(th));
    page.drawImage(png, { x, y, width: w, height: h, rotate: PDFLib.degrees(deg), opacity });
  }

  async function doWatermark() {
    const s = state.wm;
    if (!s) return toast(t('errNeedFile'), 'error');
    const text = $('#wmText').value.trim();
    if (!text) return toast(t('errWmEmpty'), 'error');
    const size = +$('#wmSize').value, opacity = (+$('#wmOpacity').value) / 100;
    const color = $('#wmColor').value, layout = $('#wmLayout').value;

    await runTask('wm', async progress => {
      await ensurePdfLib();
      progress(.1, `${t('reading')} — ${s.file.name}`); await tick();
      let pdf;
      try { pdf = await PDFLib.PDFDocument.load(await s.file.arrayBuffer()); }
      catch (e) { throw fileError(e, s.file.name); }

      progress(.2, t('preparing')); await tick();
      const { canvas, w, h } = await renderWmCanvas(text, size, color);
      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      const png = await pdf.embedPng(await blob.arrayBuffer());

      const pages = pdf.getPages();
      for (let i = 0; i < pages.length; i++) {
        const page = pages[i];
        const { width: pw, height: ph } = page.getSize();
        if (layout === 'center') {
          const deg = 45, th = deg * Math.PI / 180;
          // Shrink if the rotated text would overflow the page
          const k = Math.min(1,
            (pw * 0.9) / (w * Math.cos(th) + h * Math.sin(th)),
            (ph * 0.9) / (w * Math.sin(th) + h * Math.cos(th)));
          drawRotated(page, png, pw / 2, ph / 2, w * k, h * k, deg, opacity);
        } else {
          const deg = 30, k = Math.min(1, pw / (w * 1.4));
          const dw = w * k, dh = h * k;
          const stepX = dw * 1.35, stepY = dh * 2.6;
          let row = 0;
          for (let cy = stepY / 2; cy < ph + stepY / 2; cy += stepY, row++) {
            const offset = row % 2 ? stepX / 2 : 0;
            for (let cx = offset; cx < pw + stepX / 2; cx += stepX) {
              drawRotated(page, png, cx, cy, dw, dh, deg, opacity);
            }
          }
        }
        if (i % 5 === 0) { progress(.25 + (i / pages.length) * .65, `${t('pageWord')} ${i + 1}/${pages.length}`); await tick(5); }
      }
      progress(.95, t('saving'));
      return { bytes: await pdf.save(), name: `${baseName(s.file.name)}_watermarked.pdf` };
    });
  }

  /* ------------------------------------------------------------------
   * Navigation, theme, language
   * ------------------------------------------------------------------ */
  function showTool(id) {
    if (!$(`#tool-${id}`)) id = 'merge';
    $$('.tool').forEach(s => s.classList.toggle('hidden', s.dataset.tool !== id));
    $$('[data-tab]').forEach(b => b.classList.toggle('tab-active', b.dataset.tab === id));
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t('docTitle');
    $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    $$('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    $('#langLabel').textContent = lang === 'ar' ? 'English' : 'العربية';
    renderList('merge'); renderList('img');
    ['split', 'protect', 'wm'].forEach(renderSingle);
    Object.keys(results).forEach(renderResult);
    lucide.createIcons();
  }

  function setupWhatsApp() {
    const href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(WHATSAPP_MESSAGE)}`;
    $$('[data-wa]').forEach(a => { a.href = href; });
  }

  function init() {
    $('#year').textContent = new Date().getFullYear();
    buildDropzones();
    bindListActions();
    setupWhatsApp();

    $$('[data-tab]').forEach(b => b.addEventListener('click', () => showTool(b.dataset.tab)));
    window.addEventListener('hashchange', () => showTool(location.hash.slice(1)));

    $('#langBtn').addEventListener('click', () => {
      lang = lang === 'ar' ? 'en' : 'ar';
      try { localStorage.setItem('lang', lang); } catch (e) {}
      applyLang();
    });
    $('#themeBtn').addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
    });
    $('#pwToggle').addEventListener('click', () => {
      const show = $('#pw1').type === 'password';
      $('#pw1').type = $('#pw2').type = show ? 'text' : 'password';
      $('#pwToggle').innerHTML = `<i data-lucide="${show ? 'eye-off' : 'eye'}" class="h-5 w-5"></i>`;
      lucide.createIcons();
    });

    $('#btnMerge').addEventListener('click', doMerge);
    $('#btnSplit').addEventListener('click', doSplit);
    $('#btnImg').addEventListener('click', doImages);
    $('#btnProtect').addEventListener('click', doProtect);
    $('#btnWm').addEventListener('click', doWatermark);

    let wmTimer;
    ['wmText', 'wmSize', 'wmOpacity', 'wmColor'].forEach(id =>
      $('#' + id).addEventListener('input', () => { clearTimeout(wmTimer); wmTimer = setTimeout(updateWmPreview, 120); }));
    updateWmPreview();

    applyLang();
    showTool(location.hash.slice(1) || 'merge');

    // Start loading the libraries in the background so the tools are instant when used.
    // (The encryption build is loaded later, only if the user opens "Protect PDF".)
    Promise.allSettled([ensurePdfLib(), ensureJsPdf()]).then(r => {
      if (r.some(x => x.status === 'rejected')) toast(t('errLib'), 'error');
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
